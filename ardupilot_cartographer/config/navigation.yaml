bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: *default_use_sim_time

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: *default_use_sim_time

controller_server:
  ros__parameters:
    # TODO: enable when navigation2 supports twist stamped
    # enable_stamped_cmd_vel: True
    use_sim_time: *default_use_sim_time
    failure_tolerance: 0.3
    controller_frequency: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.1
      min_lookahead: 0.35
      max_lookahead: 2.0
      initial_rotation: true
      initial_rotation_threshold: 0.75
      prefer_final_rotation: false
      allow_backward: true
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.5
      v_angular_max: 1.0
      v_angular_min_in_place: 1.0
      slowdown_radius: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: *default_use_sim_time
      robot_radius: 0.35
      resolution: 0.05
      update_frequency: 1.0
      publish_frequency: 1.0
      lethal_cost_threshold: 75
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.9
        cost_scaling_factor: 6.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: *default_use_sim_time
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      robot_radius: 0.35
      lethal_cost_threshold: 75
      always_send_full_costmap: True
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.9
        cost_scaling_factor: 6.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: *default_use_sim_time
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: true
      downsampling_factor: 2
      allow_unknown: true
      max_iterations: 500000
      max_on_approach_iterations: 500
      terminal_checking_interval: 10000
      max_planning_time: 2.0
      cost_travel_multiplier: 8.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 500
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-8
        do_refinement: true
        refinement_num: 1

smoother_server:
  ros__parameters:
    use_sim_time: *default_use_sim_time
    smoother_plugins: ["simple_smoother"]
    enable_stamped_cmd_vel: True
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    use_sim_time: *default_use_sim_time
    enable_stamped_cmd_vel: True
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

velocity_smoother:
  ros__parameters:
    use_sim_time: *default_use_sim_time
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    velocity_timeout: 1.0
